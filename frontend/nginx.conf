# frontend/nginx.conf

server {
    listen 80;
    server_name localhost;

    # Папка со статическими файлами React-приложения
    root /usr/share/nginx/html;
    index index.html;

    # ─── Проксирование API-запросов на бэкенд ────────────────────────────────
    # Все запросы /api/* перенаправляем на NestJS-контейнер
    # 'backend' — имя сервиса в docker-compose, Docker DNS резолвит его автоматически
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        # Заголовки для корректной передачи данных о клиенте
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Важно для httpOnly cookie (refresh token)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # ─── SPA-роутинг ──────────────────────────────────────────────────────────
    # При прямом переходе на /rooms/123 или /bookings — отдаём index.html
    # React Router сам разберётся какой компонент рендерить
    # Без этого блока Nginx вернёт 404 на любом маршруте кроме /
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических ассетов — JS/CSS/картинки
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}